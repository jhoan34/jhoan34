<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 50) rotate(135) scale(360 220)">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 210) rotate(-25) scale(340 180)">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94A3B8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="240" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="240" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="240" rx="16" fill="url(#glow1)"/>
  <rect width="1200" height="240" rx="16" fill="url(#glow2)"/>
  <rect x="0.5" y="0.5" width="1199" height="239" rx="15.5" stroke="#334155" stroke-opacity="0.6"/>

  <!-- Accent pill -->
  <rect x="64" y="48" width="184" height="28" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.45"/>
