  <circle cx="882" cy="74" r="4.5" fill="#475569"/>
  <circle cx="898" cy="74" r="4.5" fill="#475569"/>
  <circle cx="914" cy="74" r="4.5" fill="#475569"/>
  <text x="882" y="106" fill="#38BDF8" font-family="Consolas, ui-monospace, monospace" font-size="13">focus:</text>
  <text x="936" y="106" fill="#E2E8F0" font-family="Consolas, ui-monospace, monospace" font-size="13">"Full-Stack &amp; APIs"</text>
  <text x="882" y="130" fill="#818CF8" font-family="Consolas, ui-monospace, monospace" font-size="13">stack:</text>
  <text x="936" y="130" fill="#CBD5E1" font-family="Consolas, ui-monospace, monospace" font-size="13">["TS", "Node", "SQL"]</text>
