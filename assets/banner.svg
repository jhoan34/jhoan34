  <text x="96" y="66" fill="#E2E8F0" font-family="Segoe UI, Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" letter-spacing="0.6">SOFTWARE DEVELOPER</text>

  <!-- Name / Handle -->
  <text x="64" y="128" fill="#F8FAFC" font-family="Segoe UI, Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="46" font-weight="700" letter-spacing="-0.8">Jhoan</text>
  <text x="205" y="128" fill="#38BDF8" font-family="Segoe UI, Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="500">@jhoan34</text>

